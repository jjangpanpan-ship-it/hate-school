<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생 관리 시스템</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --text: #1f2a44;
            --muted: #7a859c;
            --line: #e6eaf2;
            --primary: #4f6ef7;
            --primary-dark: #3a56d8;
            --primary-soft: #eef1ff;
            --danger: #e5484d;
            --danger-soft: #fdecec;
            --success: #1f9d63;
            --success-soft: #e6f6ee;
            --warn: #c27803;
            --warn-soft: #fff6e0;
            --shadow: 0 10px 30px rgba(31, 42, 68, .08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Pretendard Variable', Pretendard, 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ───── 상단 네비게이션 ───── */
        .navbar { background: var(--card); border-bottom: 1px solid var(--line); }
        .navbar-inner {
            max-width: 960px; margin: 0 auto; padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }
        .brand-logo {
            width: 34px; height: 34px; border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), #8a5cf6);
            color: #fff; display: grid; place-items: center; font-size: 18px;
        }
        .nav-tag { font-size: 13px; color: var(--muted); background: var(--bg); padding: 6px 12px; border-radius: 999px; }

        /* ───── 히어로 ───── */
        .hero {
            background: linear-gradient(135deg, #4f6ef7 0%, #7a5cf6 100%);
            color: #fff; padding: 48px 20px 90px; text-align: center;
        }
        .hero h1 { margin: 0 0 10px; font-size: clamp(26px, 5vw, 36px); letter-spacing: -0.8px; }
        .hero p { margin: 0; opacity: .85; font-size: 15px; }

        /* ───── 메인 레이아웃 ───── */
        .container {
            max-width: 960px; margin: -56px auto 40px; padding: 0 20px;
            display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start;
        }
        .left-col { display: grid; gap: 20px; }
        @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }

        .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 24px; }
        .card h2 { margin: 0 0 18px; font-size: 17px; letter-spacing: -0.3px; }

        /* ───── 폼 ───── */
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
        .field { margin-bottom: 16px; }
        input[type="text"], input[type="number"], input[type="date"], textarea, select {
            width: 100%; padding: 12px 14px; font-size: 15px; font-family: inherit;
            color: var(--text); border: 1.5px solid var(--line); border-radius: 12px;
            background: #fafbfe; outline: none;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px var(--primary-soft);
        }
        input[readonly] { background: var(--bg); color: var(--muted); }
        .check { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; font-weight: 500; line-height: 1.5; cursor: pointer; }
        .check input { margin-top: 3px; }

        button {
            font-family: inherit; font-size: 14px; font-weight: 600; border: none;
            border-radius: 12px; padding: 12px 14px; cursor: pointer;
            transition: transform .1s, background .15s, box-shadow .15s, opacity .15s;
        }
        button:active:not(:disabled) { transform: translateY(1px); }
        button:disabled { opacity: .5; cursor: not-allowed; }

        .btn-primary {
            width: 100%; background: var(--primary); color: #fff; font-size: 15px; padding: 14px;
            box-shadow: 0 6px 16px rgba(79, 110, 247, .3);
        }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-outline { background: var(--primary-soft); color: var(--primary-dark); }
        .btn-outline:hover:not(:disabled) { background: #e1e7ff; }
        .btn-danger { background: var(--danger-soft); color: var(--danger); }
        .btn-danger:hover:not(:disabled) { background: #fbdada; }
        .btn-gray { background: var(--bg); color: var(--text); }
        .btn-gray:hover:not(:disabled) { background: #e9edf5; }

        /* ───── 결과 영역 ───── */
        .placeholder { text-align: center; padding: 56px 16px; color: var(--muted); }
        .placeholder .big { font-size: 44px; margin-bottom: 10px; }
        .placeholder p { margin: 0; line-height: 1.6; font-size: 14px; }

        .profile { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .avatar {
            width: 52px; height: 52px; border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), #8a5cf6);
            color: #fff; font-size: 22px; font-weight: 800;
            display: grid; place-items: center; flex-shrink: 0;
        }
        .profile-name { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
        .badge {
            display: inline-block; margin: 4px 4px 0 0; font-size: 12px; font-weight: 600;
            color: var(--primary-dark); background: var(--primary-soft); padding: 3px 10px; border-radius: 999px;
        }
        .badge.gray { color: var(--muted); background: var(--bg); }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
        .stat { background: var(--bg); border-radius: 14px; padding: 16px 12px; text-align: center; }
        .stat .num { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .stat .num small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; }
        .stat .label { font-size: 12px; color: var(--muted); margin-top: 4px; }

        .today-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 10px; }
        .today-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
            margin-bottom: 8px; font-size: 14px;
        }
        .today-row .k { color: var(--muted); }
        .today-row .v { font-weight: 600; text-align: right; }
        .pill {
            display: inline-block; padding: 3px 10px; border-radius: 999px;
            font-size: 12px; font-weight: 700; background: var(--success-soft); color: var(--success);
        }
        .pill.off { background: var(--danger-soft); color: var(--danger); }
        .sub { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 3px; }

        .action-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 16px; }

        /* ───── 장비 연결 상태 ───── */
        .gw { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600;
              padding: 6px 12px; border-radius: 999px; background: var(--bg); color: var(--muted); }
        .gw .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
        .gw.ok { background: var(--success-soft); color: var(--success); }
        .gw.ok .dot { background: var(--success); }
        .gw.partial { background: var(--warn-soft); color: var(--warn); }
        .gw.partial .dot { background: var(--warn); }
        .gw.off { background: var(--danger-soft); color: var(--danger); }
        .gw.off .dot { background: var(--danger); }

        /* ───── 코멘트 ───── */
        .pill.warn { background: var(--warn-soft); color: var(--warn); }
        .comment { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; }
        .comment-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
        .comment-text { line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .link-btn { background: none; color: var(--danger); padding: 4px 8px; font-size: 12px; border-radius: 8px; }
        .link-btn:hover:not(:disabled) { background: var(--danger-soft); }
        .comment-form { background: var(--bg); border-radius: 14px; padding: 14px; margin-top: 10px; }
        .comment-form .form-grid { margin-bottom: 0; }
        .comment-form .field { margin-bottom: 12px; }

        /* ───── 수정 폼 ───── */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
        .form-grid .full { grid-column: 1 / -1; }
        .form-section { font-size: 13px; font-weight: 700; color: var(--muted); margin: 6px 0 12px; }
        @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }

        /* ───── 알림 박스 ───── */
        .alert { padding: 16px 18px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
        .alert.error { background: var(--danger-soft); color: #b3262b; }
        .alert.success { background: var(--success-soft); color: #167a4c; }
        .alert.warn { background: var(--warn-soft); color: var(--warn); }
        .note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 10px; }

        .pick-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
        .pick-list button {
            width: 100%; text-align: left; background: #fff; color: var(--text);
            border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;
        }
        .pick-list button:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }

        .loading { opacity: .6; pointer-events: none; }

        footer { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 30px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-inner">
            <div class="brand">
                <div class="brand-logo">🎓</div>
                학생 관리 시스템
            </div>
            <span class="gw" id="gw-status"><span class="dot"></span><span id="gw-text">장비 상태 확인 중…</span></span>
        </div>
    </nav>

    <header class="hero">
        <h1>학생 출결 관리</h1>
        <p>학생을 추가하고, 이름으로 조회해 출결 정보를 자유롭게 수정하세요.</p>
    </header>

    <main class="container">

        <div class="left-col">
            <!-- 학생 검색 -->
            <section class="card">
                <h2>학생 검색</h2>

                <div class="field">
                    <label for="update-name">학생 이름</label>
                    <input type="text" id="update-name" placeholder="예) 홍길동" autocomplete="off">
                </div>

                <button class="btn-primary" id="btn-search">학생 조회</button>

                <div class="btn-row">
                    <button class="btn-outline" id="btn-edit">정보 수정</button>
                    <button class="btn-outline" id="btn-late">지각 변수 정정</button>
                </div>
                <div class="btn-row" style="grid-template-columns: 1fr;">
                    <button class="btn-danger" id="btn-reset">당일 출결 리셋</button>
                </div>
            </section>

            <!-- 새 학생 추가 -->
            <section class="card">
                <h2>새 학생 추가</h2>

                <div class="field">
                    <label for="add-name">이름</label>
                    <input type="text" id="add-name" placeholder="예) 김민수" autocomplete="off">
                </div>

                <div class="field">
                    <label for="add-id">학생 번호 <span class="hint">(= 지문 저장 번호)</span></label>
                    <input type="number" id="add-id" min="1" step="1" placeholder="자동 추천">
                </div>

                <div class="field">
                    <label class="check">
                        <input type="checkbox" id="add-hw" checked>
                        <span>카드·지문 바로 등록<br>
                        <span class="hint">컴퓨터가 아두이노·파이썬과 연결되어 있어야 하며, 장비 등록에 성공해야 학생이 저장됩니다. 체크를 끄면 이름만 먼저 저장됩니다.</span></span>
                    </label>
                </div>

                <button class="btn-primary" id="btn-add">학생 추가</button>
                <p class="note">학생 번호는 지문 센서의 저장 칸 번호로 쓰이므로 센서 저장 용량 이내의 숫자여야 합니다.</p>
            </section>
        </div>

        <!-- 오른쪽: 결과 -->
        <section class="card" id="result-card">
            <h2>조회 결과</h2>
            <div id="update-result">
                <div class="placeholder">
                    <div class="big">🔍</div>
                    <p>학생 이름을 입력하고<br>조회 버튼을 눌러보세요.</p>
                </div>
            </div>
        </section>

    </main>

    <footer>© 학생 관리 시스템</footer>

    <script>
    // ───────────── Firebase 연결 ─────────────
    const firebaseConfig = {
        databaseURL: "https://school-system-c8892-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 파이썬(DB)과 같은 문구를 써야 하므로 python 파일의 STATUS_* 값과 동일하게 유지하세요.
    const STATUS_NONE = "❌ 미등교";
    const STATUS_ARRIVED = "✅ 등교";
    const STATUS_LATE = "⚠️ 지각";
    const STATUS_LEAVE_NONE = "❌ 미하교";
    const STATUS_LEFT = "✅ 하교";

    // ───────────── 공통 유틸 ─────────────
    const nameInput = document.getElementById('update-name');
    let selectedId = null;   // 동명이인 중 목록에서 고른 학생의 DB 키 (1회용)
    let lastAction = null;   // 마지막으로 누른 버튼 동작 (학생을 고른 뒤 이어서 실행)
    let currentTarget = null; // 지금 결과 화면에 표시 중인 학생 {id, data}
    const resultDiv = document.getElementById('update-result');
    const resultCard = document.getElementById('result-card');

    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function showMessage(html, type) {
        resultDiv.innerHTML = `<div class="alert ${type || ''}">${html}</div>`;
    }

    // 작업 중 버튼 잠금 (연타로 인한 중복 실행 방지)
    function setBusy(busy) {
        document.querySelectorAll('button').forEach((b) => { b.disabled = busy; });
        resultCard.classList.toggle('loading', busy);
    }

    async function run(task) {
        setBusy(true);
        try {
            await task();
        } catch (error) {
            console.error(error);
            showMessage("❌ 에러: 데이터베이스 작업에 실패했습니다. 잠시 후 다시 시도하세요.", 'error');
        } finally {
            setBusy(false);
        }
    }

    // ───────────── 장비(파이썬·아두이노) 연결 확인 ─────────────
    // 파이썬이 3초마다 system/gateway 에 {ts, arduino} 를 기록합니다. ts 가 오래되면 파이썬이 꺼진 것으로 봅니다.
    const GW_STALE_MS = 10000;
    let serverOffset = 0;
    let lastGateway = null;
    database.ref('.info/serverTimeOffset').on('value', (snap) => { serverOffset = snap.val() || 0; });

    function gatewayStateFrom(g) {
        if (!g || !g.ts) return { python: false, arduino: false };
        const python = (Date.now() + serverOffset - g.ts) < GW_STALE_MS;
        return { python, arduino: python && !!g.arduino };
    }

    async function getGatewayState() {
        const snap = await database.ref('system/gateway').once('value');
        lastGateway = snap.val();
        return gatewayStateFrom(lastGateway);
    }

    function renderGatewayPill() {
        const st = gatewayStateFrom(lastGateway);
        const el = document.getElementById('gw-status');
        const text = document.getElementById('gw-text');
        el.className = 'gw ' + (st.arduino ? 'ok' : st.python ? 'partial' : 'off');
        text.textContent = st.arduino ? '장비 연결됨' : st.python ? '아두이노 연결 안 됨' : '파이썬 연결 안 됨';
    }
    database.ref('system/gateway').on('value', (snap) => { lastGateway = snap.val(); renderGatewayPill(); });
    setInterval(renderGatewayPill, 2000);

    function warn(msg) {
        alert(msg);
        showMessage('❌ ' + esc(msg), 'error');
    }

    // 장비가 필요한 작업 전에 호출. 연결이 안 되어 있으면 안내하고 false 를 반환 (DB는 건드리지 않음)
    async function ensureHardware() {
        const g = await getGatewayState();
        renderGatewayPill();
        if (!g.python) {
            warn('파이썬 게이트웨이와 연결되어 있지 않습니다.\n컴퓨터에서 gateway.py 가 실행 중인지 확인하세요.');
            return false;
        }
        if (!g.arduino) {
            warn('컴퓨터가 아두이노와 연결되어 있지 않습니다.\nUSB 연결과 COM 포트를 확인하세요.');
            return false;
        }
        return true;
    }

    // 파이썬에 명령을 보내고 결과(system/result)를 기다림. op: 1=재등록, 2=삭제, 3=새 학생+등록
    function waitForResult(req, timeoutMs) {
        return new Promise((resolve) => {
            const ref = database.ref('system/result');
            let timer = null;
            const handler = ref.on('value', (snap) => {
                const v = snap.val();
                if (v && String(v.req) === req) {
                    clearTimeout(timer);
                    ref.off('value', handler);
                    resolve(v);
                }
            });
            timer = setTimeout(() => {
                ref.off('value', handler);
                resolve({ ok: false, message: '응답 시간이 초과되었습니다. 파이썬 창의 로그를 확인하세요.' });
            }, timeoutMs);
        });
    }

    async function sendCommand(op, id, name) {
        const req = String(Date.now());
        const waiter = waitForResult(req, 100000);
        await database.ref('system/command').set(`${op}:${id}:${req}` + (name !== undefined ? ':' + name : ''));
        return waiter;
    }

    async function refreshStudent(id) {
        const snap = await database.ref('students/' + id).once('value');
        return snap.exists() ? { id, data: snap.val() } : null;
    }

    // ───────────── 학생 찾기 ─────────────
    async function findStudents(name, id) {
        if (id) {
            const snap = await database.ref('students/' + id).once('value');
            const data = snap.val();
            return (data && data.이름 === name) ? [{ id, data }] : [];
        }
        const snap = await database.ref('students').orderByChild('이름').equalTo(name).once('value');
        const list = [];
        snap.forEach((child) => { list.push({ id: child.key, data: child.val() }); });
        return list;
    }

    async function resolveTarget() {
        const name = nameInput.value.trim();
        const id = selectedId;
        selectedId = null;

        if (!name) {
            alert("학생의 이름을 입력하세요!");
            nameInput.focus();
            return null;
        }

        const matches = await findStudents(name, id);

        if (matches.length === 0) {
            showMessage("❌ 에러: 명단에 일치하는 학생이 없습니다.", 'error');
            return null;
        }
        if (matches.length > 1) {
            const items = matches.map((m) =>
                `<li><button type="button" data-pick="${esc(m.id)}">
                    <span>${esc(m.data.이름)}</span><span>학생 번호: ${esc(m.id)}</span>
                </button></li>`
            ).join('');
            showMessage(
                `⚠️ 같은 이름의 학생이 ${matches.length}명 있습니다. 아래에서 해당 학생을 선택하세요.
                 <ul class="pick-list">${items}</ul>`,
                'warn'
            );
            return null;
        }
        return matches[0];
    }

    // 결과 영역 안의 모든 클릭(동명이인 선택, 수정/재등록/취소 버튼)을 한 곳에서 처리
    resultDiv.addEventListener('click', (e) => {
        const pick = e.target.closest('[data-pick]');
        if (pick) {
            selectedId = pick.dataset.pick;
            (lastAction || searchStudent)();
            return;
        }
        const act = e.target.closest('[data-action]');
        if (!act || !currentTarget) return;
        if (act.dataset.action === 'edit') renderEditForm(currentTarget);
        if (act.dataset.action === 'cancel-edit') renderStudent(currentTarget);
        if (act.dataset.action === 'hw-reg') startHardwareRegistration(currentTarget);
        if (act.dataset.action === 'delete') deleteStudent(currentTarget);
        if (act.dataset.action === 'del-comment') deleteComment(act.dataset.key);
    });

    // ───────────── 조회 결과 카드 ─────────────
    function renderStudent(target) {
        currentTarget = target;
        const s = target.data;
        const attended = !String(s.오늘상태 || '').includes('미');
        const leftSchool = !String(s.하교_여부 || '').includes('미') && s.하교_여부;
        const hwDone = s.rfid_uid && s.finger_id;

        resultDiv.innerHTML = `
            <div class="profile">
                <div class="avatar">${esc(String(s.이름).charAt(0))}</div>
                <div>
                    <div class="profile-name">${esc(s.이름)}</div>
                    <span class="badge">학생 번호: ${esc(target.id)}</span>
                    <span class="badge">지문 번호: ${esc(s.finger_id ?? '미등록')}</span>
                    <span class="badge gray">카드: ${esc(s.rfid_uid || '미등록')}</span>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="num">${esc(s.총_출석_수 || 0)}<small>회</small></div>

                </div>
                <div class="stat">
                    <div class="num">${esc(s.지각_변수 || 0)}<small>회</small></div>
                    <div class="label">누적 지각</div>
                </div>
                <div class="stat">
                    <div class="num">${esc(s.하교_횟수 || 0)}<small>회</small></div>
                    <div class="label">누적 하교</div>
                </div>
            </div>

            <p class="today-title">오늘 현황</p>
            <div class="today-row">
                <span class="k">출석 상태</span>
                <span class="v">
                    <span class="pill ${attended ? '' : 'off'}">${esc(s.오늘상태 || '-')}</span>
                    <span class="sub">시간: ${esc(s.출석시간 || '-')}</span>
                </span>
            </div>
            <div class="today-row">
                <span class="k">하교 여부</span>
                <span class="v">
                    <span class="pill ${leftSchool ? '' : 'off'}">${esc(s.하교_여부 || '-')}</span>
                    <span class="sub">시간: ${esc(s.하교_시간 || '-')}</span>
                </span>
            </div>

            <div class="action-row">
                <button type="button" class="btn-outline" data-action="edit">✏️ 정보 수정</button>
                <button type="button" class="btn-gray" data-action="hw-reg">${hwDone ? '🔁 카드·지문 재등록' : '🪪 카드·지문 등록'}</button>
                <button type="button" class="btn-danger" data-action="delete">🗑️ 학생 삭제</button>
            </div>

            ${commentsHtml(target)}
        `;
    }

    // ───────────── 지각·결석 코멘트 ─────────────
    function todayStr() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }

    function commentsHtml(target) {
        const s = target.data;
        const list = Object.entries(s.코멘트 || {})
            .map(([key, v]) => ({ key, ...v }))
            .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.ts || 0) - (a.ts || 0));

        const status = String(s.오늘상태 || '');
        const defType = status.includes('지각') ? '지각' : (status.includes('미') ? '결석' : '지각');

        const items = list.length ? list.map((c) => `
            <div class="comment">
                <div class="comment-head">
                    <span><span class="pill ${c.type === '결석' ? 'off' : 'warn'}">${esc(c.type)}</span> <b>${esc(c.date)}</b></span>
                    <button type="button" class="link-btn" data-action="del-comment" data-key="${esc(c.key)}">삭제</button>
                </div>
                <div class="comment-text">${esc(c.text)}</div>
            </div>`).join('')
            : '<p class="note" style="margin:0 0 8px">등록된 코멘트가 없습니다.</p>';

        return `
            <p class="today-title" style="margin-top:22px">지각·결석 코멘트 (${list.length})</p>
            ${items}
            <form class="comment-form" id="comment-form" novalidate>
                <div class="form-grid">
                    <div class="field">
                        <label for="c-date">날짜</label>
                        <input type="date" id="c-date" value="${todayStr()}">
                    </div>
                    <div class="field">
                        <label for="c-type">구분</label>
                        <select id="c-type">
                            <option value="지각" ${defType === '지각' ? 'selected' : ''}>지각</option>
                            <option value="결석" ${defType === '결석' ? 'selected' : ''}>결석</option>
                        </select>
                    </div>
                    <div class="field full">
                        <label for="c-text">코멘트</label>
                        <textarea id="c-text" maxlength="300" placeholder="예) 병원 진료로 지각 (학부모 연락 완료)"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-outline" style="width:100%">코멘트 추가</button>
            </form>
        `;
    }

    function addComment() {
        const target = currentTarget;
        if (!target) return;
        const date = document.getElementById('c-date').value;
        const type = document.getElementById('c-type').value;
        const text = document.getElementById('c-text').value.trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { alert('날짜를 선택하세요.'); return; }
        if (!text) { alert('코멘트 내용을 입력하세요.'); return; }

        run(async () => {
            await database.ref('students/' + target.id + '/코멘트').push({
                date, type, text, ts: firebase.database.ServerValue.TIMESTAMP
            });
            const fresh = await refreshStudent(target.id);
            if (fresh) renderStudent(fresh);
        });
    }

    function deleteComment(key) {
        const target = currentTarget;
        if (!target || !key) return;
        if (!confirm('이 코멘트를 삭제하시겠습니까?')) return;
        run(async () => {
            await database.ref('students/' + target.id + '/코멘트/' + key).remove();
            const fresh = await refreshStudent(target.id);
            if (fresh) renderStudent(fresh);
        });
    }

    resultDiv.addEventListener('submit', (e) => {
        if (e.target.id === 'comment-form') {
            e.preventDefault();
            addComment();
        }
    });

    // ───────────── 1. 학생 조회 ─────────────
    function searchStudent() {
        lastAction = searchStudent;
        return run(async () => {
            const target = await resolveTarget();
            if (!target) return;
            renderStudent(target);
        });
    }

    // ───────────── 2. 지각 변수 정정 ─────────────
    function updateLate() {
        lastAction = updateLate;
        return run(async () => {
            const target = await resolveTarget();
            if (!target) return;

            const input = prompt(
                `🔢 [${target.data.이름}] 학생의 누적 지각 횟수를 숫자로 입력하세요:`,
                target.data.지각_변수 || 0
            );
            if (input === null) return;

            const trimmed = input.trim();
            if (!/^\d+$/.test(trimmed)) {
                showMessage("❌ 에러: 0 이상의 정수만 입력할 수 있습니다.", 'error');
                return;
            }
            const newLate = parseInt(trimmed, 10);

            await database.ref('students/' + target.id).update({ "지각_변수": newLate });
            showMessage(`✅ 지각 변수 정정 완료: [${esc(target.data.이름)}] 현재 ${newLate}회로 변경됨`, 'success');
        });
    }

    // ───────────── 3. 당일 출결 상태 리셋 ─────────────
    function calcRollback(s) {
        const status = String(s.오늘상태 || '');
        const leave = String(s.하교_여부 || '');
        return {
            attended: status !== '' && status !== '-' && !status.includes('미'),
            late: status.includes('지각'),
            left: leave !== '' && leave !== '-' && !leave.includes('미')
        };
    }
    const dec = (v) => Math.max(0, (Number(v) || 0) - 1);

    function buttonReset() {
        lastAction = buttonReset;
        return run(async () => {
            const target = await resolveTarget();
            if (!target) return;

            const before = target.data;
            const plan = calcRollback(before);
            const changes = [];
            if (plan.attended) changes.push(`• 누적 출석일수: ${before.총_출석_수 || 0}회 → ${dec(before.총_출석_수)}회`);
            if (plan.late)     changes.push(`• 누적 지각횟수: ${before.지각_변수 || 0}회 → ${dec(before.지각_변수)}회`);
            if (plan.left)     changes.push(`• 누적 하교횟수: ${before.하교_횟수 || 0}회 → ${dec(before.하교_횟수)}회`);

            const ok = confirm(
                `⚠️ [${before.이름}] 학생의 오늘 출결 기록을 초기화합니다.\n\n` +
                (changes.length ? changes.join('\n') : '• 누적 기록은 변경되지 않습니다.') +
                `\n\n진행하시겠습니까?`
            );
            if (!ok) return;

            const done = { attended: false, late: false, left: false };
            const result = await database.ref('students/' + target.id).transaction((s) => {
                if (s === null) return s;
                const rb = calcRollback(s);
                done.attended = rb.attended; done.late = rb.late; done.left = rb.left;

                if (rb.attended) s.총_출석_수 = dec(s.총_출석_수);
                if (rb.late)     s.지각_변수 = dec(s.지각_변수);
                if (rb.left)     s.하교_횟수 = dec(s.하교_횟수);

                s.오늘상태 = STATUS_NONE;
                s.출석시간 = "-";
                s.하교_여부 = STATUS_LEAVE_NONE;
                s.하교_시간 = "-";
                return s;
            });

            if (!result.committed) {
                showMessage("❌ 에러: 초기화가 반영되지 않았습니다. 다시 시도하세요.", 'error');
                return;
            }

            const rolled = [];
            if (done.attended) rolled.push('출석 -1');
            if (done.late)     rolled.push('지각 -1');
            if (done.left)     rolled.push('하교 -1');
            showMessage(
                `✅ 데이터 정정 완료: [${esc(before.이름)}] 오늘 기록이 미등교 상태로 초기화됨` +
                (rolled.length ? `<br>누적 반영: ${rolled.join(', ')}` : '<br>누적 기록은 변경되지 않음'),
                'success'
            );
        });
    }

    // ───────────── 4. 학생 정보 수정 ─────────────
    function editStudent() {
        lastAction = editStudent;
        return run(async () => {
            const target = await resolveTarget();
            if (!target) return;
            renderEditForm(target);
        });
    }

    function optionList(values, selected) {
        return values.map((v) => `<option value="${esc(v)}" ${v === selected ? 'selected' : ''}>${esc(v)}</option>`).join('');
    }

    function renderEditForm(target) {
        currentTarget = target;
        const s = target.data;
        const statusOptions = [STATUS_NONE, STATUS_ARRIVED, STATUS_LATE];
        const leaveOptions = [STATUS_LEAVE_NONE, STATUS_LEFT];
        // DB에 예전 문구가 들어 있어도 선택값이 사라지지 않도록 현재 값을 목록에 포함
        if (s.오늘상태 && !statusOptions.includes(s.오늘상태)) statusOptions.push(s.오늘상태);
        if (s.하교_여부 && !leaveOptions.includes(s.하교_여부)) leaveOptions.push(s.하교_여부);

        resultDiv.innerHTML = `
            <div class="profile">
                <div class="avatar">${esc(String(s.이름).charAt(0))}</div>
                <div>
                    <div class="profile-name">${esc(s.이름)} 정보 수정</div>
                    <span class="badge">학생 번호: ${esc(target.id)}</span>
                    <span class="badge">지문 번호: ${esc(s.finger_id ?? '미등록')}</span>
                </div>
            </div>

            <form id="edit-form" novalidate>
                <p class="form-section">기본 정보</p>
                <div class="form-grid">
                    <div class="field full">
                        <label for="e-name">이름</label>
                        <input type="text" id="e-name" value="${esc(s.이름)}" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="e-id">학생 번호 <span class="hint">(변경 불가)</span></label>
                        <input type="text" id="e-id" value="${esc(target.id)}" readonly>
                    </div>
                    <div class="field">
                        <label for="e-rfid">카드 UID <span class="hint">(변경 불가)</span></label>
                        <input type="text" id="e-rfid" value="${esc(s.rfid_uid || '미등록')}" readonly>
                    </div>
                </div>

                <p class="form-section">누적 기록</p>
                <div class="form-grid">
                    <div class="field">
                        <label for="e-total">누적 출석일수</label>
                        <input type="number" id="e-total" min="0" step="1" value="${esc(s.총_출석_수 || 0)}">
                    </div>
                    <div class="field">
                        <label for="e-late">누적 지각</label>
                        <input type="number" id="e-late" min="0" step="1" value="${esc(s.지각_변수 || 0)}">
                    </div>
                    <div class="field">
                        <label for="e-leavecnt">누적 하교</label>
                        <input type="number" id="e-leavecnt" min="0" step="1" value="${esc(s.하교_횟수 || 0)}">
                    </div>
                </div>

                <p class="form-section">오늘 현황</p>
                <div class="form-grid">
                    <div class="field">
                        <label for="e-status">출석 상태</label>
                        <select id="e-status">${optionList(statusOptions, s.오늘상태 || STATUS_NONE)}</select>
                    </div>
                    <div class="field">
                        <label for="e-arrive">출석 시간 <span class="hint">HH:MM:SS 또는 -</span></label>
                        <input type="text" id="e-arrive" value="${esc(s.출석시간 || '-')}" placeholder="08:30:00" autocomplete="off">
                    </div>
                    <div class="field">
                        <label for="e-leavestatus">하교 여부</label>
                        <select id="e-leavestatus">${optionList(leaveOptions, s.하교_여부 || STATUS_LEAVE_NONE)}</select>
                    </div>
                    <div class="field">
                        <label for="e-leave">하교 시간 <span class="hint">HH:MM:SS 또는 -</span></label>
                        <input type="text" id="e-leave" value="${esc(s.하교_시간 || '-')}" placeholder="15:30:00" autocomplete="off">
                    </div>
                </div>

                <div class="action-row">
                    <button type="submit" class="btn-primary" style="box-shadow:none">저장</button>
                    <button type="button" class="btn-gray" data-action="cancel-edit">취소</button>
                </div>
                <p class="note">누적 기록과 오늘 현황은 서로 자동 연동되지 않으니 직접 맞춰 주세요. 출석/하교 시간이 “-”이면 장비는 아직 등교/하교하지 않은 것으로 판단합니다.</p>
            </form>
        `;

        document.getElementById('edit-form').addEventListener('submit', (e) => {
            e.preventDefault();
            saveEdit(target);
        });
    }

    const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$/;

    function saveEdit(target) {
        const val = (id) => document.getElementById(id).value.trim();
        const name = val('e-name');
        const status = val('e-status');
        const leaveStatus = val('e-leavestatus');
        let arrive = val('e-arrive') || '-';
        let leave = val('e-leave') || '-';
        const counts = { total: val('e-total'), late: val('e-late'), leavecnt: val('e-leavecnt') };

        const fail = (msg) => { alert(msg); return; };

        if (!name) return fail('이름을 입력하세요.');
        for (const [key, label] of [['total', '누적 출석일수'], ['late', '누적 지각'], ['leavecnt', '누적 하교']]) {
            if (!/^\d+$/.test(counts[key])) return fail(`${label}은(는) 0 이상의 정수여야 합니다.`);
        }
        if (arrive !== '-' && !TIME_RE.test(arrive)) return fail('출석 시간은 HH:MM:SS 형식(예: 08:30:00) 또는 - 로 입력하세요.');
        if (leave !== '-' && !TIME_RE.test(leave)) return fail('하교 시간은 HH:MM:SS 형식(예: 15:30:00) 또는 - 로 입력하세요.');

        const isArrived = !status.includes('미');
        const isLeft = !leaveStatus.includes('미');

        // 미등교/미하교면 시간은 "-" 로 맞추고, 등교/하교 상태인데 시간이 없으면 막음
        if (!isArrived) arrive = '-';
        else if (arrive === '-') return fail('등교/지각 상태에서는 출석 시간을 입력해야 합니다.');
        if (!isLeft) leave = '-';
        else if (leave === '-') return fail('하교 상태에서는 하교 시간을 입력해야 합니다.');
        if (isLeft && !isArrived) return fail('미등교 상태에서는 하교 처리할 수 없습니다.');

        const updates = {
            이름: name,
            총_출석_수: parseInt(counts.total, 10),
            지각_변수: parseInt(counts.late, 10),
            하교_횟수: parseInt(counts.leavecnt, 10),
            오늘상태: status,
            출석시간: arrive,
            하교_여부: leaveStatus,
            하교_시간: leave
        };

        run(async () => {
            const ref = database.ref('students/' + target.id);
            await ref.update(updates);
            const snap = await ref.once('value');
            const fresh = { id: target.id, data: snap.val() };
            nameInput.value = fresh.data.이름;
            renderStudent(fresh);
            resultDiv.insertAdjacentHTML('afterbegin',
                `<div class="alert success" style="margin-bottom:16px">✅ [${esc(fresh.data.이름)}] 학생 정보가 저장되었습니다.</div>`);
        });
    }

    // ───────────── 5. 카드·지문 (재)등록 명령 전송 ─────────────
    // 파이썬이 system/command 를 감시하다가 "1:학생번호" 를 받으면 아두이노에 REG 명령을 보냅니다.
    // 장비가 연결되어 있지 않으면 시작하지 않으며, 등록이 끝날 때까지 결과를 기다립니다.
    function startHardwareRegistration(target) {
        run(async () => {
            if (!(await ensureHardware())) return;

            const ok = confirm(
                `[${target.data.이름}] 학생(번호 ${target.id})의 카드·지문 등록을 시작합니다.\n\n` +
                `• 아두이노 LCD 안내에 따라 20초 안에 카드를 태그하고 지문을 두 번 찍으세요.\n` +
                (target.data.rfid_uid ? `• 기존 카드/지문 정보는 새로 등록한 값으로 덮어써집니다.\n` : '') +
                `\n진행하시겠습니까?`
            );
            if (!ok) return;

            showMessage(`📡 아두이노 LCD의 안내에 따라 <b>${esc(target.data.이름)}</b> 학생의 카드와 지문을 등록하세요. (최대 약 1분)`, 'warn');
            const res = await sendCommand(1, target.id);
            if (!res.ok) { showMessage('❌ ' + esc(res.message), 'error'); return; }

            const fresh = await refreshStudent(target.id);
            if (fresh) renderStudent(fresh);
            resultDiv.insertAdjacentHTML('afterbegin', `<div class="alert success" style="margin-bottom:16px">✅ ${esc(res.message)}</div>`);
        });
    }

    // ───────────── 5-2. 학생 삭제 ─────────────
    // 카드·지문이 등록된 학생은 지문 센서에서도 지워야 하므로 장비 연결이 필요합니다.
    function deleteStudent(target) {
        const s = target.data;
        const hasHw = s.finger_id !== undefined && s.finger_id !== null && s.finger_id !== '';

        run(async () => {
            if (hasHw && !(await ensureHardware())) return;

            const ok = confirm(
                `🗑️ [${s.이름}] 학생(번호 ${target.id})을 삭제합니다.\n\n` +
                `• 출결 기록과 코멘트가 모두 사라지며 되돌릴 수 없습니다.\n` +
                (hasHw ? `• 지문 센서에 저장된 지문도 함께 삭제됩니다.\n` : '') +
                `\n정말 삭제하시겠습니까?`
            );
            if (!ok) return;

            if (hasHw) {
                showMessage('⏳ 지문 센서에서 지문을 삭제하는 중입니다…', 'warn');
                const res = await sendCommand(2, target.id);
                if (!res.ok) { showMessage('❌ ' + esc(res.message), 'error'); return; }
            } else {
                await database.ref('students/' + target.id).remove();
            }

            currentTarget = null;
            nameInput.value = '';
            showMessage(`✅ [${esc(s.이름)}] 학생을 삭제했습니다.`, 'success');
            suggestNextId();
        });
    }

    // ───────────── 6. 새 학생 추가 ─────────────
    const addNameInput = document.getElementById('add-name');
    const addIdInput = document.getElementById('add-id');
    const addHwCheck = document.getElementById('add-hw');

    // 비어 있는 다음 번호(가장 큰 번호 + 1)를 추천
    async function suggestNextId() {
        try {
            const snap = await database.ref('students').once('value');
            let max = 0;
            snap.forEach((child) => {
                const n = parseInt(child.key, 10);
                if (!isNaN(n) && n > max) max = n;
            });
            addIdInput.value = max + 1;
        } catch (err) {
            console.error(err);
        }
    }

    function addStudent() {
        const name = addNameInput.value.trim();
        const idRaw = addIdInput.value.trim();

        if (!name) { alert('새 학생의 이름을 입력하세요!'); addNameInput.focus(); return; }
        if (!/^[1-9]\d*$/.test(idRaw)) { alert('학생 번호는 1 이상의 정수여야 합니다.'); addIdInput.focus(); return; }
        const id = String(parseInt(idRaw, 10));

        run(async () => {
            // [카드·지문 바로 등록] 장비 연결이 안 되어 있으면 아무것도 저장하지 않고 중단
            if (addHwCheck.checked) {
                if (!(await ensureHardware())) return;

                const exists = await database.ref('students/' + id).once('value');
                if (exists.exists()) {
                    showMessage(`❌ 에러: 학생 번호 ${esc(id)}번은 이미 사용 중입니다. 다른 번호를 입력하세요.`, 'error');
                    return;
                }

                // 파이썬이 장비 등록에 성공했을 때만 학생을 DB에 만듭니다.
                showMessage(`📡 아두이노 LCD의 안내에 따라 <b>${esc(name)}</b> 학생의 카드와 지문을 등록하세요. (최대 약 1분)<br>등록이 성공해야 학생이 저장됩니다.`, 'warn');
                const res = await sendCommand(3, id, name);
                if (!res.ok) {
                    showMessage('❌ 학생이 추가되지 않았습니다. ' + esc(res.message), 'error');
                    return;
                }
                const fresh = await refreshStudent(id);
                if (fresh) renderStudent(fresh);
                resultDiv.insertAdjacentHTML('afterbegin', `<div class="alert success" style="margin-bottom:16px">✅ 학생 추가 완료: [${esc(name)}] (학생 번호 ${esc(id)}) — 카드·지문 등록됨</div>`);
                nameInput.value = name;
                addNameInput.value = '';
                await suggestNextId();
                return;
            }

            const newStudent = {
                이름: name,
                오늘상태: STATUS_NONE,
                출석시간: "-",
                하교_여부: STATUS_LEAVE_NONE,
                하교_시간: "-",
                총_출석_수: 0,
                지각_변수: 0,
                하교_횟수: 0
            };

            // 트랜잭션으로 "이미 있는 번호는 덮어쓰지 않기"를 보장
            const result = await database.ref('students/' + id).transaction((current) => {
                if (current !== null) return; // 이미 있으면 중단
                return newStudent;
            });

            if (!result.committed) {
                showMessage(`❌ 에러: 학생 번호 ${esc(id)}번은 이미 사용 중입니다. 다른 번호를 입력하세요.`, 'error');
                return;
            }

            showMessage(`✅ 학생 추가 완료: [${esc(name)}] (학생 번호 ${esc(id)})<br>카드·지문은 아직 미등록 상태입니다. 조회 화면의 “카드·지문 등록” 버튼으로 나중에 등록할 수 있습니다.`, 'success');
            addNameInput.value = '';
            await suggestNextId();
        });
    }

    // ───────────── 이벤트 연결 ─────────────
    document.getElementById('btn-search').addEventListener('click', searchStudent);
    document.getElementById('btn-edit').addEventListener('click', editStudent);
    document.getElementById('btn-late').addEventListener('click', updateLate);
    document.getElementById('btn-reset').addEventListener('click', buttonReset);
    document.getElementById('btn-add').addEventListener('click', addStudent);

    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchStudent(); });
    addNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addStudent(); });

    suggestNextId();
    </script>

</body>
</html>

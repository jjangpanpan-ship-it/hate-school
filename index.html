<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학생 관리 시스템</title>
</head>
<body>

    <!-- 화면에 보여질 HTML 요소들이 들어갈 자리 (예시) -->
    <input type="text" id="update-name" placeholder="학생 이름 입력">
    <div id="update-result"></div>

    <!-- 코드 실행을 위한 스크립트 태그 -->
    <script>
    resultDiv.innerHTML = `📋 <b>[조회 성공] -> ${s.이름} (지문 방: ${id}번)</b><br>
• 누적 총 출석일수: ${s.총_출석_수}회<br>
• 누적 총 지각횟수: ${s.지각_변수}회<br>
• 누적 총 하교횟수: ${s.하교_횟수}회<br>
• 오늘 출석 상태: ${s.오늘상태} (시간: ${s.출석시간})<br>
• 오늘 하교 여부: ${s.하교_여부}`;

break;
}

if (!found) {
    resultDiv.innerHTML = "❌ 에러: 데이터베이스 명단에 일치하는 이름이 없습니다.";
}
});
}

// 🛠️ [3단계 정정 버튼 함수]
// 팝업창(prompt) 인풋을 띄워 클라우드 변수 데이터를 강제 정정 수정
function updateInfo(type) {
    const targetName = document.getElementById('update-name').value.trim();
    const resultDiv = document.getElementById('update-result');

    if (!targetName) {
        alert("정정하고 싶은 학생의 이름을 정확히 입력하세요!");
        return;
    }

    database.ref('students').once('value').then((snapshot) => {
        const data = snapshot.val();

        let targetKey = null;
        let targetData = null;

        for (let id in data) {
            if (data[id].이름 === targetName) {
                targetKey = id;
                targetData = data[id];
                break;
            }
        }

        if (!targetKey) {
            resultDiv.innerHTML =
                "❌ 에러: 일치하는 학생 수첩 칸이 명단에 없습니다.";
            return;
        }

        // 지각 변수 정정 클릭 시 문법
        if (type === 'late') {
            const newLate = prompt(
                "🔢 이 학생의 누적 지각 횟수를 숫자로 치세요:",
                targetData.지각_변수
            );

            if (newLate !== null) {
                database.ref('students/' + targetKey).update({
                    "지각_변수": parseInt(newLate)
                });

                resultDiv.innerHTML =
                    `✅ 지각 변수 정정 완료: 현재 ${newLate}회로 변경됨`;
            }
        }

        // 당일 출결 상태 강제 초기화 리셋 클릭 시 문법
        else if (type === 'reset') {
            if (confirm(
                "⚠️ 진짜 이 학생의 오늘 하루 출결 변수 데이터를 미등교 상태로 초기 정정하시겠습니까?"
            )) {
                database.ref('students/' + targetKey).update({
                    "오늘상태": "❌ 미등교",
                    "출석시간": "-",
                    "하교_여부": "❌ 미하교",
                    "하교_시간": "-"
                });

                resultDiv.innerHTML =
                    `✅ 데이터 정정 완료: [${targetData.이름}] 오늘 하루 데이터가 미등교 상태로 청소됨`;
            }
        }
    });
}

    </script>

</body>
</html>
